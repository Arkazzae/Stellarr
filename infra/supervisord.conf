# Runs every service of the container. Programs start in priority order and
# restart on exit; their output goes to the container's stdout and stderr.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

# stellarr-tls-maintenance reloads nginx and restarts TURN through supervisorctl.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

# Stellarr Media carries every call. It starts before the API, which resets it
# on start. It needs no file and no privilege, and it parses packets from the
# Internet, so it does not run as root.
[program:media]
command=/opt/stellarr/media/stellarr-media
user=nobody
priority=15
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/usr/share/dotnet/dotnet /opt/stellarr/api/Stellarr.Api.dll
directory=/opt/stellarr/api
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/node /opt/stellarr/web/web/server.js
directory=/opt/stellarr/web/web
priority=30
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:turn]
command=/usr/bin/turnserver -c /etc/turnserver.conf
priority=40
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:tls-maintenance]
command=/usr/local/bin/stellarr-tls-maintenance watch
priority=60
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
