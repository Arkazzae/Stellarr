# Template: the entrypoint replaces __PUBLIC_HTTPS_SUFFIX__ and writes the result
# to /etc/nginx/nginx.conf.
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Larger than the API's 100 MB video limit so multipart framing still fits.
    # The API enforces the per-media limits itself.
    client_max_body_size 128m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # A TLS proxy in front of this container (Nginx Proxy Manager, Caddy, a load
    # balancer) forwards plain HTTP and says so in X-Forwarded-Proto. Such a
    # request must not be redirected to HTTPS again, and the API has to see
    # "https" so that secure cookies and generated links are right.
    map $http_x_forwarded_proto $external_https {
        default 0;
        https   1;
    }

    map "$scheme:$external_https" $redirect_to_https {
        default  0;
        "http:0" 1;
    }

    map $external_https $effective_forwarded_proto {
        default $scheme;
        1       https;
    }

    upstream stellarr_web {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream stellarr_api {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        if ($redirect_to_https) {
            return 308 https://$host__PUBLIC_HTTPS_SUFFIX__$request_uri;
        }

        ssl_certificate     /data/stellarr/tls/fullchain.pem;
        ssl_certificate_key /data/stellarr/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self)" always;

        location = /health {
            proxy_pass http://stellarr_api/health/ready;
            proxy_set_header Host $host;
        }

        # The desktop client's handshake reports the instance's origin, taken
        # from X-Forwarded-Host so that it keeps the port the client used.
        location = /.well-known/stellarr/client {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        }

        # Plain HTTP only: the API has no WebSocket endpoint outside /hubs/.
        location ~ ^/(api|assets|health)/ {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_read_timeout 75s;
        }

        location /hubs/ {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_read_timeout 75s;
        }

        # Translation models are fetched only after a user turns on local chat
        # translation. Serving them from this origin avoids CORS and lets the
        # browser keep them in IndexedDB. The upstream path must match the
        # rewrite in web/next.config.ts.
        location /bergamot-models-gcs/ {
            proxy_pass https://storage.googleapis.com/bergamot-models-sandbox/0.3.3/;
            proxy_ssl_server_name on;
            proxy_set_header Host storage.googleapis.com;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # The operator panel is built with base /ops/.
        location = /ops {
            return 308 /ops/;
        }

        location /ops/ {
            root /srv;
            try_files $uri $uri/ /ops/index.html;
        }

        location / {
            proxy_pass http://stellarr_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        }
    }
}
