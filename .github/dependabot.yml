version: 2

# Every ecosystem updates weekly. Minor and patch updates share one pull request
# per ecosystem; major updates get their own. Version updates wait five days
# after a release (security updates are not delayed). The commit prefix keeps the
# pull request titles, which become the squash commit subjects, in the
# repository's commit format.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 5
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 5
    commit-message:
      prefix: build(deps)
    # typescript-eslint, which the lint runs on, supports TypeScript below 6.1
    # only, and TypeScript 7 fails the lint job. Lift this once it supports 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: npm
    directory: /cockpit
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 5
    commit-message:
      prefix: build(deps)
    # typescript-eslint, which the lint runs on, supports TypeScript below 6.1
    # only, and TypeScript 7 fails the lint job. Lift this once it supports 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 5
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 5
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 5
    commit-message:
      prefix: build(deps)
