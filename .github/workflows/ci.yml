name: CI

# Runs for pull requests into main and for pushes to main; a push to any other
# branch runs nothing. A draft pull request runs nothing until it is marked ready
# for review. Each job runs only when files it checks have changed, so a change
# to the web client does not rebuild the server. A job that does not run counts
# as passed for branch protection. "Run workflow" on the Actions tab checks
# everything.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      ops: ${{ steps.filter.outputs.ops }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A manual run, the first push of a branch, or a base that is no
          # longer in the history checks everything.
          if [[ $EVENT == workflow_dispatch || -z $BASE || $BASE =~ ^0+$ ]] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=ALL
          elif [[ $EVENT == pull_request ]]; then
            changed=$(git diff --name-only "$BASE...$HEAD")
          else
            changed=$(git diff --name-only "$BASE" "$HEAD")
          fi
          printf 'Changed files:\n%s\n' "$changed"
          check() {
            if [[ $changed == ALL ]] || grep -qE "$2" <<<"$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check server '^(server/|Stellarr\.slnx$|Directory\.Build\.props$|global\.json$|\.github/workflows/ci\.yml$)'
          check web '^(web/|\.github/workflows/ci\.yml$)'
          check ops '^(ops/|\.github/workflows/ci\.yml$)'
          check image '^(Dockerfile$|\.dockerignore$|infra/|server/.*\.csproj$|server/.*packages\.lock\.json$|(web|ops)/package(-lock)?\.json$|global\.json$|Directory\.Build\.props$|\.github/workflows/ci\.yml$)'

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # NuGet audit is on by default and the build treats warnings as errors,
      # so a restore that finds a known vulnerable package fails here.
      - run: dotnet restore Stellarr.slnx --locked-mode
      - run: dotnet build Stellarr.slnx --no-restore --configuration Release
      - run: dotnet test Stellarr.slnx --no-build --configuration Release

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ops:
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ops/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the image without pushing it, when the Dockerfile, the container
  # configuration or a dependency list changes. On main it also refreshes the
  # build cache that the release workflow reuses.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stellarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A build can succeed while a process inside cannot start, so run the
      # image and wait until both the API and the web client answer.
      - name: Start the image and check that it serves
        run: |
          docker run -d --name stellarr -e PUBLIC_HOST=localhost -p 8443:443 stellarr:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' stellarr)
            [[ $status == healthy || $status == unhealthy ]] && break
            sleep 5
          done
          echo "Container health: $status"
          if [[ $status != healthy ]] \
             || ! curl -kfsS -o /dev/null https://localhost:8443/health \
             || ! curl -kfsS -o /dev/null https://localhost:8443/login; then
            docker logs stellarr 2>&1 | tail -n 80
            exit 1
          fi
