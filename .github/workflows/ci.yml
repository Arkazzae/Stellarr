name: CI

# Runs for pull requests into main and for pushes to main; a push to any other
# branch runs nothing. A draft pull request runs nothing until it is marked ready
# for review. Each job runs only when files it checks have changed, so a change
# to the web client does not rebuild the server. A job that does not run counts
# as passed for branch protection. "Run workflow" on the Actions tab checks
# everything.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      cockpit: ${{ steps.filter.outputs.cockpit }}
      media: ${{ steps.filter.outputs.media }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A manual run, the first push of a branch, or a base that is no
          # longer in the history checks everything.
          if [[ $EVENT == workflow_dispatch || -z $BASE || $BASE =~ ^0+$ ]] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=ALL
          elif [[ $EVENT == pull_request ]]; then
            changed=$(git diff --name-only "$BASE...$HEAD")
          else
            changed=$(git diff --name-only "$BASE" "$HEAD")
          fi
          printf 'Changed files:\n%s\n' "$changed"
          check() {
            if [[ $changed == ALL ]] || grep -qE "$2" <<<"$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check server '^(server/|Stellarr\.slnx$|Directory\.Build\.props$|global\.json$|\.github/workflows/ci\.yml$)'
          # web and cockpit are workspaces of one npm project: a change to the
          # shared packages or to the root manifest or lockfile affects both.
          check web '^(web/|packages/|package(-lock)?\.json$|branding/icons/|\.github/workflows/ci\.yml$)'
          check cockpit '^(cockpit/|packages/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'
          check media '^(media/|\.github/workflows/ci\.yml$)'
          check image '^(Dockerfile$|\.dockerignore$|infra/|server/.*\.csproj$|server/.*packages\.lock\.json$|packages/|package(-lock)?\.json$|\.npmrc$|(web|cockpit)/package\.json$|media/Cargo\.(toml|lock)$|global\.json$|Directory\.Build\.props$|\.github/workflows/ci\.yml$)'

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # NuGet audit is on by default and the build treats warnings as errors,
      # so a restore that finds a known vulnerable package fails here.
      - run: dotnet restore Stellarr.slnx --locked-mode
      - run: dotnet build Stellarr.slnx --no-restore --configuration Release
      - run: dotnet test Stellarr.slnx --no-build --configuration Release

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      # One install at the repository root covers every workspace.
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:ui
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run typecheck:ui
      - run: npm run test:ui
      # branding/icons/ is exported from the icon paths in @stellarr/ui; a
      # glyph changed in one place only fails here.
      - run: npm run icons:export -w @stellarr/ui -- --check
      # Every token the package reads must be defined by each app, spelled as
      # the package spells it, and listed in its README.
      - run: npm run tokens:check -w @stellarr/ui
      - run: npm run build:web

  cockpit:
    needs: changes
    if: needs.changes.outputs.cockpit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:cockpit
      - run: npm run typecheck:cockpit
      - run: npm run test:cockpit
      # The tokens are checked here as well: a change to cockpit/src/index.css
      # alone runs only this job.
      - run: npm run tokens:check -w @stellarr/ui
      - run: npm run build:cockpit

  media:
    needs: changes
    if: needs.changes.outputs.media == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: media
    steps:
      - uses: actions/checkout@v7
      # The runner image ships rustup. This moves it to the current stable
      # release, the one the image build takes from rust:1-slim-bookworm.
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: media
      - run: cargo fmt --check
      # --locked fails when Cargo.lock no longer matches Cargo.toml, as the
      # image build would.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Builds the image without pushing it, when the Dockerfile, the container
  # configuration or a dependency list changes. On main it also refreshes the
  # build cache that the release workflow reuses.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stellarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A build can succeed while a process inside cannot start, so run the
      # image and wait until both the API and the web client answer.
      - name: Start the image and check that it serves
        run: |
          docker run -d --name stellarr -e PUBLIC_HOST=localhost -p 8443:443 stellarr:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' stellarr)
            [[ $status == healthy || $status == unhealthy ]] && break
            sleep 5
          done
          echo "Container health: $status"
          if [[ $status != healthy ]] \
             || ! curl -kfsS -o /dev/null https://localhost:8443/health \
             || ! curl -kfsS -o /dev/null https://localhost:8443/login; then
            docker logs stellarr 2>&1 | tail -n 80
            exit 1
          fi
      # The operator CLI ships in the same image and must work without the API.
      - name: Check the packaged operator CLI
        run: |
          docker run --rm --entrypoint stellarr stellarr:ci version
          docker run --rm --entrypoint stellarr stellarr:ci --help >/dev/null
