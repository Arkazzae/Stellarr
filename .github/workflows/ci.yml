name: CI

on:
  pull_request:
    # "edited" re-checks the title of the pull request after it is renamed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # NuGet audit is on by default and the build treats warnings as errors,
      # so a restore that finds a known vulnerable package fails here.
      - run: dotnet restore Stellarr.slnx --locked-mode
      - run: dotnet build Stellarr.slnx --no-restore --configuration Release
      - run: dotnet test Stellarr.slnx --no-build --configuration Release

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ops/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the image without pushing it, so a change that breaks the Dockerfile
  # fails its pull request. Runs on main too, which fills the build cache.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pull requests are squash-merged and the title becomes the commit subject,
  # so the title has to follow the format that .githooks/commit-msg checks.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|build|ci|chore|perf)(\([a-z0-9][a-z0-9-]*\))?: [a-z0-9].*[^.[:space:]]$'
          if [[ ! $TITLE =~ $pattern ]]; then
            echo "::error::The title must look like 'type(scope): subject' in lower case, with no trailing period. Types: feat, fix, refactor, test, docs, build, ci, chore, perf."
            exit 1
          fi
          if (( ${#TITLE} > 72 )); then
            echo "::error::The title is ${#TITLE} characters long, the limit is 72."
            exit 1
          fi
