name: Pull request title

# Pull requests are squash-merged and the title becomes the commit subject, so
# the title has to follow the format that .githooks/commit-msg checks. This is
# a separate workflow so that renaming a pull request re-runs only this check.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|build|ci|chore|perf)(\([a-z0-9][a-z0-9-]*\))?: [a-z0-9].*[^.[:space:]]$'
          if [[ ! $TITLE =~ $pattern ]]; then
            echo "::error::The title must look like 'type(scope): subject' in lower case, with no trailing period. Types: feat, fix, refactor, test, docs, build, ci, chore, perf."
            exit 1
          fi
          if (( ${#TITLE} > 72 )); then
            echo "::error::The title is ${#TITLE} characters long, the limit is 72."
            exit 1
          fi
