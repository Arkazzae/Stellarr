name: Docs

# Builds the documentation site (docs/, built with VitePress) and publishes it
# to Cloudflare Pages at https://docs.stellarr.online. The build fails on a
# link to a page that does not exist, so it doubles as the link check.
#
# Runs for pull requests into main and for pushes to main that change the
# pages, the site configuration or the brand files the site reads; a push to
# any other branch runs nothing. A draft pull request runs nothing until it is
# marked ready for review. Only a run on main publishes (a push, or "Run
# workflow" on the Actions tab); a pull request or "Run workflow" on another
# branch builds the site and stops.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - "branding/logo/**"
      - "branding/guidelines/fonts/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "branding/logo/**"
      - "branding/guidelines/fonts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          # The "last updated" date of a page comes from the git history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    # One deployment at a time, and a deployment that has started is never
    # cancelled by a newer push.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # The "last updated" date of a page comes from the git history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx --yes wrangler@4.164.0 pages deploy .vitepress/dist --project-name stellarr-docs --branch main --commit-hash ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
